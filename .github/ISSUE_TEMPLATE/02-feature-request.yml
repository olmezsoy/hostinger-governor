name: Feature request
description: Suggest a change to how the governor behaves or what it reports.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Example commands, config fields or output help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including any workaround you use today.
  - type: markdown
    attributes:
      value: |
        Two rules are deliberate. The daemon never reads Hostinger's help article, and API history never raises the credit estimate. A proposal that changes either needs evidence from real billing.
