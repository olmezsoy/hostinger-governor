name: Bug report
description: The governor, installer or broker doesn't behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security problems privately through the [security policy](https://github.com/olmezsoy/hostinger-governor/security/policy), not here.

        Never paste a Hostinger API token or credential file. `governor status --json` lists usernames, so remove any you don't want public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install with ...
        2. Run ...
  - type: input
    id: version
    attributes:
      label: Governor version
      description: The output of `governor version`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Hostinger plan
      options:
        - KVM 1
        - KVM 2
        - KVM 4
        - KVM 8
        - Another plan or provider
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and systemd version
      description: For example `Ubuntu 24.04`, plus the first line of `systemctl --version`.
    validations:
      required: true
  - type: dropdown
    id: api-access
    attributes:
      label: Hostinger API access
      options:
        - token_file
        - token_command
        - request_command broker
        - None configured
  - type: textarea
    id: status
    attributes:
      label: Output of governor status --json
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from `journalctl -u governor.service`.
      render: text
