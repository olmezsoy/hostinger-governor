name: Release
on:
  pull_request:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - run: deno task check
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - name: Build
        run: |
          mkdir dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            deno task compile:jitless \
              --target "$target" -o "dist/governor-$target"
          done
          cp install.sh dist/
          cp examples/resource-report.html dist/
          cp tools/hostinger-broker.py dist/
          cp tools/setup-hostinger-broker.sh tools/setup-hostinger-broker.py dist/
          (cd dist && sha256sum governor-* install.sh resource-report.html hostinger-broker.py setup-hostinger-broker.sh setup-hostinger-broker.py > SHA256SUMS)
      - name: Linux smoke test
        run: deno task smoke:linux dist/governor-x86_64-unknown-linux-gnu
      - name: Publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" == "v$(dist/governor-x86_64-unknown-linux-gnu version)" ]]
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes
