name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # full: broker integration; sudo-grant: production broker grant only; none: skipped.
          - runner: ubuntu-24.04
            broker: full
          - runner: ubuntu-22.04
            broker: none
          - runner: ubuntu-26.04
            broker: sudo-grant
          - runner: ubuntu-24.04-arm
            broker: full
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
      - run: deno task check
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: bash -n install.sh
      - run: deno task compile:jitless
      - name: Linux smoke test
        run: deno task smoke:linux dist/governor
        env:
          GOVERNOR_SMOKE_BROKER: ${{ matrix.broker == 'full' }}
      - name: Production broker sudo grant
        if: matrix.broker == 'sudo-grant'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 test/broker-sudo-linux.py
  studies:
    # Twenty eight-week studies, about a minute and a half in all; a changed pass or limit count
    # fails the job (test/studies.ts, docs/study-results.json).
    name: eight-week studies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
      - run: deno task sim:check
  daemon-cpu:
    # A simulated day of control passes without the JIT, as release binaries run; above 0.1% of a
    # core fails.
    name: daemon CPU budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
      - run: deno task bench:cpu
