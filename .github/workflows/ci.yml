name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            broker: true
          # systemd 249 needs coverage; encrypted broker credentials require systemd 250+.
          - runner: ubuntu-22.04
            broker: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - run: deno task check
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: bash -n install.sh
      - run: deno task compile
      - name: Build JIT-enabled installer compatibility fixture
        run: deno compile --allow-all -o test/.tmp/governor-jit src/main.ts
      - run: bash test/smoke-linux.sh dist/governor test/.tmp/governor-jit
        env:
          GOVERNOR_SMOKE_BROKER: ${{ matrix.broker }}
