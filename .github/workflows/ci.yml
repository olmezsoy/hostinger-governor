name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            broker: true
          - runner: ubuntu-22.04
            broker: false
          - runner: ubuntu-26.04
            broker: false
          - runner: ubuntu-24.04-arm
            broker: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - run: deno task check
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: bash -n install.sh
      - run: deno task compile
      - name: Linux smoke test, including daemon MDWE opt-in on systemd 255+
        run: deno task smoke:linux dist/governor
        env:
          GOVERNOR_SMOKE_BROKER: ${{ matrix.broker }}
      - name: Production broker sudo grant on sudo-rs
        if: matrix.runner == 'ubuntu-26.04'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 test/broker-sudo-linux.py
